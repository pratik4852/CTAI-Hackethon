name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Import check
        working-directory: backend
        run: python -c "import mepiq_core, app.main; print(mepiq_core.__version__)"

      - name: Tests
        working-directory: backend
        env:
          MEPIQ_DATA_DIR: ${{ runner.temp }}/mepiq-data
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Layout invariants
        working-directory: frontend
        run: node test/check-layout.mjs

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build single-container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mepiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name mepiq -p 8000:8000 mepiq:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { docker logs mepiq; exit 1; }
          curl -fsS http://127.0.0.1:8000/api/catalogue > /dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/
          docker rm -f mepiq
